apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-frontend
  template:
    metadata:
      labels:
        app: llm-frontend
    spec:
      containers:
      - name: llm-frontend
        image: llm-reliability-analyzer-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: llm-frontend-service
spec:
  selector:
    app: llm-frontend
  ports:
  - port: 8501
    targetPort: 8501
  type: NodePort